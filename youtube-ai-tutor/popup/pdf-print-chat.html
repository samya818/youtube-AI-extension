<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat Export</title>
  <link rel="stylesheet" href="../lib/katex/katex.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap');
    @page {
      size: A4;
      margin: 18mm 20mm;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1e293b;
      line-height: 1.65;
      margin: 0;
      padding: 0;
      background: #ffffff;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px 20px;
    }
    .chat-header {
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 16px;
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .chat-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 4px;
      letter-spacing: -0.02em;
    }
    .chat-header .subtitle {
      font-size: 13px;
      color: #64748b;
      margin: 0;
    }
    .chat-header .meta {
      font-size: 12px;
      color: #94a3b8;
      text-align: right;
    }

    /* Messages */
    .msg {
      margin-bottom: 20px;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .msg-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .msg.user .msg-label  { color: #1d4ed8; }
    .msg.assistant .msg-label { color: #475569; }
    .msg.image .msg-label { color: #d97706; }

    .msg-bubble {
      padding: 12px 15px;
      border-radius: 12px;
      font-size: 13.5px;
    }
    .msg.user .msg-bubble {
      background: #eff6ff;
      border-left: 4px solid #3b82f6;
      color: #1e3a8a;
      font-weight: 500;
    }
    .msg.assistant .msg-bubble {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #334155;
    }
    .msg.image .msg-bubble {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-left: 4px solid #f59e0b;
    }

    .chat-print-caption {
      font-size: 12px;
      color: #92400e;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .chat-print-img {
      max-width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      display: block;
      margin: 8px auto 0;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    /* Rich content inside bubbles */
    .rich-content > :first-child { margin-top: 0; }
    .rich-content > :last-child  { margin-bottom: 0; }
    .rich-content p { margin: 0 0 0.7em; }
    .rich-content p:last-child { margin-bottom: 0; }
    .rich-content .md-h1, .rich-content .md-h2, .rich-content .md-h3 {
      font-weight: 700; margin: 0.85em 0 0.4em; line-height: 1.3; color: #0f172a;
    }
    .rich-content .md-h1 { font-size: 16px; }
    .rich-content .md-h2 { font-size: 15px; }
    .rich-content .md-h3 { font-size: 14px; color: #334155; }
    .rich-content .md-list { margin: 0.4em 0 0.8em; padding-left: 1.4em; }
    .rich-content .md-list li { margin-bottom: 0.3em; }
    .rich-content .md-quote {
      margin: 0.6em 0; padding: 8px 10px;
      border-left: 3px solid #93c5fd;
      background: #eff6ff; border-radius: 0 8px 8px 0; color: #334155;
    }
    .rich-content .inline-code {
      background: #f1f5f9; padding: 2px 5px; border-radius: 4px;
      font-family: 'Fira Code', Consolas, monospace; font-size: 0.91em;
      border: 1px solid #e2e8f0;
    }
    .rich-content .code-block {
      background: #f8fafc; padding: 10px 12px; border-radius: 8px;
      font-family: 'Fira Code', Consolas, monospace; font-size: 12px;
      overflow-x: auto; margin: 0.6em 0; border: 1px solid #e2e8f0;
    }
    .rich-content a { color: #2563eb; }
    .rich-content .katex-display { overflow-x: auto; margin: 0.6em 0; }
    .rich-content strong { font-weight: 700; }
    .rich-content em { font-style: italic; }

    /* Top Action Bar (hidden on print) */
    @media print {
      .no-print { display: none !important; }
    }

    .print-toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #0f172a;
      color: #f8fafc;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .print-toolbar-title {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
    }
    .print-toolbar-actions {
      display: flex;
      gap: 10px;
    }
    .toolbar-btn {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: 0.15s;
    }
    .toolbar-btn.primary {
      background: #3b82f6;
      color: #ffffff;
    }
    .toolbar-btn.primary:hover {
      background: #2563eb;
    }
    .toolbar-btn.secondary {
      background: rgba(255,255,255,0.12);
      color: #cbd5e1;
    }
    .toolbar-btn.secondary:hover {
      background: rgba(255,255,255,0.22);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="print-toolbar no-print">
    <div class="print-toolbar-title">
      📄 <strong>Export Chat & Révisions</strong> · Prêt pour impression / sauvegarde PDF
    </div>
    <div class="print-toolbar-actions">
      <button id="manual-print-btn" class="toolbar-btn primary">🖨️ Imprimer / Enregistrer en PDF</button>
      <button id="close-tab-btn" class="toolbar-btn secondary">✕ Fermer</button>
    </div>
  </div>
  <div id="print-content">Loading chat…</div>
  <script src="../lib/katex/katex.min.js"></script>
  <script src="../lib/katex/auto-render.min.js"></script>
  <script src="../lib/message-render.js"></script>
  <script src="pdf-print-chat.js"></script>
</body>
</html>
