<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Impression Notebook</title>
  <link rel="stylesheet" href="../lib/katex/katex.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap');
    @page {
      size: A4;
      margin: 20mm;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1e293b;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    .header {
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 20px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .header-title-area {
      max-width: 70%;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 6px 0;
      letter-spacing: -0.025em;
    }
    .desc {
      font-size: 14px;
      color: #64748b;
      margin: 0;
    }
    .meta-info {
      font-size: 12px;
      color: #94a3b8;
      text-align: right;
    }
    .entry-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .entry-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }
    .entry-card-title {
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 75%;
    }
    .entry-badges {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .badge-index {
      background-color: #3b82f6;
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
    }
    .badge-time {
      background-color: #e2e8f0;
      color: #334155;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .note-box {
      background-color: #fffbeb;
      border-left: 4px solid #d97706;
      padding: 14px;
      border-radius: 6px;
      color: #78350f;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .chat-q {
      background-color: #eff6ff;
      border-left: 4px solid #3b82f6;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      color: #1e3a8a;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .chat-a-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #64748b;
      margin: 8px 10px 4px;
    }
    .chat-a {
      padding: 0 10px;
      color: #334155;
      font-size: 14px;
    }
    .chat-a p {
      margin: 0 0 10px 0;
    }
    .chat-a p:last-child {
      margin-bottom: 0;
    }
    .img-container {
      margin-top: 18px;
      text-align: center;
    }
    .img-container img {
      max-width: 100%;
      max-height: 380px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .chat-a .katex-display {
      overflow-x: auto;
      margin: 0.6em 0;
    }
    .rich-content .md-h1, .rich-content .md-h2, .rich-content .md-h3 {
      color: #0f172a;
      font-weight: 700;
      margin: 0.9em 0 0.4em 0;
      line-height: 1.35;
    }
    .rich-content .md-h1 { font-size: 16px; }
    .rich-content .md-h2 { font-size: 15px; }
    .rich-content .md-h3 { font-size: 14px; color: #334155; }
    .rich-content .md-list { margin: 0.4em 0 0.8em 0; padding-left: 1.4em; }
    .rich-content .md-list li { margin-bottom: 0.35em; }
    .rich-content .md-quote {
      margin: 0.65em 0;
      padding: 8px 10px;
      border-left: 3px solid #93c5fd;
      background: #eff6ff;
      border-radius: 0 8px 8px 0;
      color: #334155;
    }
    .rich-content .inline-code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Fira Code', Consolas, monospace;
      font-size: 0.92em;
      border: 1px solid #e2e8f0;
    }
    .rich-content .code-block {
      background: #f8fafc;
      padding: 10px 12px;
      border-radius: 8px;
      font-family: 'Fira Code', Consolas, monospace;
      font-size: 12px;
      overflow-x: auto;
      margin: 0.65em 0;
      border: 1px solid #e2e8f0;
    }
    .rich-content a { color: #2563eb; }
  </style>
</head>
<body>
  <div id="print-content">Chargement du notebook...</div>
  <script src="../lib/katex/katex.min.js"></script>
  <script src="../lib/katex/auto-render.min.js"></script>
  <script src="../lib/message-render.js"></script>
  <script src="pdf-print.js"></script>
</body>
</html>
